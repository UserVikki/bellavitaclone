
services:
  postgres:
    image: postgres:16-alpine
    container_name: bellavita-postgres
    environment:
      POSTGRES_DB: bellavitadb
      POSTGRES_USER: bellavita
      POSTGRES_PASSWORD: bellavita123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

