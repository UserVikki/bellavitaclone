# Application Settings
spring.application.name=BellaVitaClone
server.port=8080

# Database Configuration (H2 - for development)
spring.datasource.url=jdbc:h2:mem:bellavitadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=BellaVitaCloneSecretKey2024ForJWTTokenGenerationAndValidation
jwt.expiration=86400000

# CORS
spring.mvc.cors.allowed-origins=http://localhost:5173,http://localhost:3000

